<html lang="en"><head><meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SBA Practice">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">

<title>Anatomy SBA Practice</title>

<style>
/* Layout: one reading column (max 760px) — topic shelf → question card → answer reveal, sticky action bar at the bottom for thumb reach on iPad/iPhone */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E9EBE6; --line:#D9DCD4;
  --ink:#1A211E; --muted:#5C6661; --accent:#2F43A0; --accent-ink:#FFFFFF; --accent-soft:#E3E7F7;
  --ok:#1E7A4C; --ok-soft:#E1F2E8; --bad:#B3302B; --bad-soft:#F8E3E1; --warn:#8A5B00; --warn-soft:#FBF0D6;
  --f-display:ui-sans-serif,system-ui,sans-serif;
  --f-body:-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1B201E; --sunk:#232927; --line:#323A36;
  --ink:#E8ECE9; --muted:#9AA59F; --accent:#8C9DF0; --accent-ink:#0F1430; --accent-soft:#252C4D;
  --ok:#5CCB8F; --ok-soft:#18382A; --bad:#F08A84; --bad-soft:#40201E; --warn:#E8B85A; --warn-soft:#3A2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B201E; --sunk:#232927; --line:#323A36;
  --ink:#E8ECE9; --muted:#9AA59F; --accent:#8C9DF0; --accent-ink:#0F1430; --accent-soft:#252C4D;
  --ok:#5CCB8F; --ok-soft:#18382A; --bad:#F08A84; --bad-soft:#40201E; --warn:#E8B85A; --warn-soft:#3A2E14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* home */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:8px 18px}
.brand h1{font-size:clamp(28px,6vw,40px);font-weight:700;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:18px;color:var(--muted);font-size:15px}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:26px}
.mode{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:64px}
.mode strong{font-family:var(--f-display);font-weight:700;font-size:17px}
.mode span{color:var(--muted);font-size:14px}
.mode.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mode.primary span{color:inherit;opacity:.85}
.mode:disabled{opacity:.5;cursor:default}
.group-h{margin:22px 0 8px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.topic{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;min-height:64px}
.topic .name{font-weight:700;font-size:17px}
.topic .meta{grid-column:1;color:var(--muted);font-size:14px}
.topic .score{grid-row:1/3;grid-column:2;text-align:right;font-size:14px;color:var(--muted)}
.bar{grid-column:1/3;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .w{background:var(--bad)}
.foot{margin-top:28px;color:var(--muted);font-size:14px;max-width:62ch}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:14px}

/* quiz */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.top .where{flex:1;min-width:0}
.top .where .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .where .s{font-size:13px;color:var(--muted)}
.progress{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 20px}
.stem p{margin:0 0 .7em}
.stem p:last-child{font-weight:700;margin-bottom:0}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:12px}
figure{margin:14px 0 4px;text-align:center}
figure img{border-radius:10px;border:1px solid var(--line);max-height:60vh;max-width:100%;height:auto;width:auto;cursor:zoom-in;background:#fff}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:56px;font-size:17px;line-height:1.35;transition:border-color .15s,background .15s}
.opt .L{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font-family:var(--f-mono);font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.iconbtn:focus-visible,.mode:focus-visible,.topic:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .L{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.6}
.verdict{scroll-margin-top:calc(84px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-family:var(--f-display);font-size:21px;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:10px}
.xp{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.xp h3{font-family:var(--f-body);font-size:16px;font-weight:700;display:flex;gap:10px;align-items:baseline;padding:11px 14px;background:var(--sunk)}
.xp h3 .tag{margin-left:auto;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.xp.is-correct{border-color:var(--ok)}
.xp.is-correct h3{background:var(--ok-soft);color:var(--ok)}
.xp.is-chosen h3{background:var(--bad-soft);color:var(--bad)}
.xp .body{padding:10px 14px 12px}
.xp .body p{margin:0 0 .6em}
.xp .body p:last-child{margin-bottom:0}
.xp .empty{color:var(--muted);font-style:italic}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actions .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;cursor:pointer}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.src{margin-top:14px;font-size:13px;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.done{text-align:center;padding:28px 18px}
.done .big{font-family:var(--f-display);font-size:52px;font-weight:700}
.loading{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.lock{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.lock input{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;padding:0 14px}
.lock input:focus{outline:3px solid var(--accent);outline-offset:1px}
.lock .err{color:var(--bad);min-height:1.4em;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
</style>

</head><body>

</div></div>

const SALT = Uint8Array.from(atob("oHfgD0wUs8xbKyrDTpVf7Q=="), c => c.charCodeAt(0));
let KEY = null;
async function deriveKey(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:SALT, iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function decryptFile(path){
  const buf = new Uint8Array(await (await fetch(path)).arrayBuffer());

}
function normPass(p){ return (p || '').normalize('NFKC').toLowerCase().replace(/[‐-―−]/g, '-').replace(/\s+/g, ''); }
async function tryUnlock(pass){
  if (!window.crypto || !crypto.subtle) return 'nocrypto';
  let res;
  try { res = await fetch('data/check.bin'); } catch(e) { return 'nofile'; }
  if (!res.ok) return 'nofile';
  const buf = new Uint8Array(await res.arrayBuffer());
  if (buf.length !== 30) return 'nofile';
  try {
    const k = await deriveKey(normPass(pass));
    await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, k, buf.slice(12));
    KEY = k; return 'ok';
  } catch(e) { KEY = null; return 'wrong'; }
}

async function loadTopic(slug){

function topicStats(t){

async function startTopic(slug){

    <p class="src">Source: ${esc(topic.title)} · question ${q.n}${q.of ? ' of ' + q.of : ''}</p>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
  document.getElementById('homeBtn').onclick = home;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(b.dataset.letter));
  app.querySelectorAll('figure img').forEach(im => im.onclick = () => zoom(im.src));
  actions.hidden = false;
  document.getElementById('prevBtn').disabled = S.i === 0;
  document.getElementById('nextBtn').textContent = S.i === S.list.length - 1 ? 'Finish' : (answered ? 'Next' : 'Skip');
}
function reveal(q, chosen){
  const ok = chosen === q.answer;
  let h = `<div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? '✓ Correct' : '✗ Not quite'} — the answer is ${q.answer}</div>${q.note ? `<div class="note">${esc(q.note)}</div>` : ''}<div class="exp">`;
  const order = [q.answer, ...Object.keys(q.options).filter(L => L !== q.answer)];
  if (q.exp.O && q.exp.O.length){
    h += `<section class="xp"><h3>Overall explanation</h3><div class="body">${paras(q.exp.O)}${figs(q, 'O')}</div></section>`;
  }
  for (const L of order){
    const isC = L === q.answer, isW = L === chosen && !isC;
    const body = (q.exp[L] && q.exp[L].length) ? paras(q.exp[L]) : (q.exp.O ? '' : `<p class="empty">No separate explanation was shown for this option.</p>`);
    if (!body && !isC && !figs(q, L)) continue;
    h += `<section class="xp ${isC ? 'is-correct' : ''} ${isW ? 'is-chosen' : ''}">
      <h3><span class="mono">${L}</span><span>${esc(q.options[L] || '')}</span><span class="tag">${isC ? 'Correct' : isW ? 'Your answer' : ''}</span></h3>
      <div class="body">${body || ''}${figs(q, L)}</div></section>`;
  }
  h += figs(q, 'pre');
  return h + `</div>`;
}
function choose(L){
  const {q} = S.list[S.i];
  progress[q.id] = {c: L, ok: L === q.answer};
  store.set(progress);
  app.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const x = b.dataset.letter;
    b.classList.add(x === q.answer ? 'correct' : x === L ? 'wrong' : 'dim');
  });
  const r = document.getElementById('reveal');
  r.innerHTML = reveal(q, L);
  r.querySelectorAll('figure img').forEach(im => im.onclick = () => zoom(im.src));
  document.getElementById('nextBtn').textContent = S.i === S.list.length - 1 ? 'Finish' : 'Next';
  r.firstElementChild.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
}
function finish(){
  actions.hidden = true;
  let a = 0, c = 0;
  S.list.forEach(x => { const p = progress[x.q.id]; if (p){ a++; if (p.ok) c++; } });
  app.innerHTML = `<div class="card done"><div class="label">${esc(S.title)}</div>
    <div class="big mono">${c}/${a}</div><p>correct out of the questions you answered</p>
    <div class="modes" style="margin-top:18px"><button class="mode primary" type="button" id="againBtn"><strong>Back to topics</strong><span>Pick another set</span></button></div></div>`;
  document.getElementById('againBtn').onclick = home;
}
function zoom(src){ const lb = document.getElementById('lightbox'); document.getElementById('lbImg').src = src; lb.hidden = false; }
document.getElementById('lightbox').onclick = () => document.getElementById('lightbox').hidden = true;
document.getElementById('prevBtn').onclick = () => { if (S.i > 0){ S.i--; render(); } };
document.getElementById('nextBtn').onclick = () => { S.i++; render(); };
document.addEventListener('keydown', e => {
  if (!S || actions.hidden) return;
  if (/^[a-e]$/i.test(e.key)){ const b = app.querySelector(`.opt[data-letter="${e.key.toUpperCase()}"]`); if (b && !b.disabled) b.click(); }
  if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
});
boot();
</script>
</body></html>
